name: Deploy to EC2

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [ -z "$EC2_HOST" ]; then echo "::error::Secret EC2_HOST is not set"; exit 1; fi
          if [ -z "$EC2_SSH_KEY" ]; then echo "::error::Secret EC2_SSH_KEY is not set"; exit 1; fi
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keygen -y -f ~/.ssh/ec2.pem > /dev/null || { echo "::error::EC2_SSH_KEY is not a valid private key"; exit 1; }
          ssh-keyscan -T 15 -H "$EC2_HOST" >> ~/.ssh/known_hosts || { echo "::error::Cannot reach $EC2_HOST:22"; exit 1; }

      - name: Upload code
        run: |
          rsync -az --delete \
            --exclude '.git' --exclude '.venv' --exclude '__pycache__' \
            -e "ssh -i ~/.ssh/ec2.pem" \
            ./ ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/fastapi-stock-19/

      - name: Install & restart
        run: |
          ssh -i ~/.ssh/ec2.pem ubuntu@${{ secrets.EC2_HOST }} \
            "bash /home/ubuntu/fastapi-stock-19/deploy/deploy.sh"
